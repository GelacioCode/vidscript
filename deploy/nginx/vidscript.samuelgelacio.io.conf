# /etc/nginx/sites-available/vidscript.samuelgelacio.io
# After enabling, run: sudo certbot --nginx -d vidscript.samuelgelacio.io
server {
    listen 80;
    listen [::]:80;
    server_name vidscript.samuelgelacio.io;

    # Slightly above MAX_UPLOAD_MB so the app can return a friendly error.
    client_max_body_size 520M;

    # Password protection (create the file with: sudo htpasswd -c /etc/nginx/.htpasswd-vidscript <username>)
    auth_basic "VidScript";
    auth_basic_user_file /etc/nginx/.htpasswd-vidscript;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stream uploads straight to the app instead of buffering them in nginx first.
        proxy_request_buffering off;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        client_body_timeout 600s;
    }

    # Health check without the password, for uptime monitors.
    location = /api/health {
        auth_basic off;
        proxy_pass http://127.0.0.1:8010;
    }
}
