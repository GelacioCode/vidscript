services:
  vidscript:
    build: .
    container_name: vidscript
    restart: unless-stopped
    ports:
      # Only reachable from the VPS itself; nginx proxies the public domain to it.
      - "127.0.0.1:${APP_PORT:-8010}:8000"
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      WHISPER_CPU_THREADS: ${WHISPER_CPU_THREADS:-0}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-500}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-1}
      MAX_QUEUED_JOBS: ${MAX_QUEUED_JOBS:-10}
      RESULT_TTL_SECONDS: ${RESULT_TTL_SECONDS:-3600}
      CHUNK_SECONDS: ${CHUNK_SECONDS:-600}
    volumes:
      - models:/models        # Whisper model cache (downloaded once)
    mem_limit: ${MEM_LIMIT:-2g}

volumes:
  models:
